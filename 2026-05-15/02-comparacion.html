<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparaciones (===)</title>
</head>
<body>
    <script>
        const valor1 = 5;
        const valor2 = "5";

        if(valor1 == valor2){
            console.log ("es igual");
        } else {
            console.log ("no es igual");
        }
        if(valor1 === valor2){
            console.log ("es igual");
        } else {
            console.log ("no es igual");
        }
    </script>
</body>
</html>
